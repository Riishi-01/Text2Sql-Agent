[project]
name = "text2sql"
version = "0.1.0"
description = "Text-to-SQL application with Olist e-commerce dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "langchain-openai>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlglot>=25.0.0",
    "tabulate>=0.9.0",
    "uvicorn>=0.51.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["agent*", "core*", "api*"]

[project.scripts]
olist-nl2sql = "agent.main:main"
text2sql-api  = "api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: pure unit tests, no DB or network required",
    "integration: require a live PostgreSQL database",
    "e2e: require a running FastAPI server",
]
