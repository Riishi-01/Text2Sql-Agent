## Example 7: Monthly Average Order Value Trend (full dataset)

**Question:** "Monthly average order value trend across the full dataset"

```sql
SELECT
    TO_CHAR(sub.order_purchase_timestamp, 'YYYY-MM') AS ym,
    ROUND(AVG(sub.order_total), 2) AS avg_order_value,
    COUNT(*) AS n_orders
FROM (
    SELECT
        o.order_id,
        o.order_purchase_timestamp,
        SUM(oi.price + oi.freight_value) AS order_total
    FROM orders o
    JOIN order_items oi ON o.order_id = oi.order_id
    GROUP BY o.order_id, o.order_purchase_timestamp
) AS sub
GROUP BY TO_CHAR(sub.order_purchase_timestamp, 'YYYY-MM')
ORDER BY ym;
```

*Note: TO_CHAR('YYYY-MM') gives one sortable column for month buckets.
Do NOT split into EXTRACT(YEAR) + EXTRACT(MONTH) — two columns is the
wrong shape. No LIMIT — "full trend" means all months. Always include
COUNT(*) AS n_orders for auditability.*

