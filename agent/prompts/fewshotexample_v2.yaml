## Example 14: Each Seller's Share Of Items In Their State (window fn)

**Question:** "For each seller, what percent of items sold came from
sellers in the same state?"

```sql
SELECT
    seller_state,
    seller_id,
    items_sold,
    ROUND(
        100.0 * items_sold / SUM(items_sold) OVER (PARTITION BY seller_state),
        2
    ) AS pct_of_state_items
FROM (
    SELECT
        s.seller_state,
        s.seller_id,
        COUNT(*) AS items_sold
    FROM sellers s
    JOIN order_items oi ON s.seller_id = oi.seller_id
    GROUP BY s.seller_state, s.seller_id
) AS sub
ORDER BY seller_state, items_sold DESC;
```

*Note: Window function `SUM(...) OVER (PARTITION BY seller_state)`
computes the per-state total without a self-join. Subquery pre-aggregates
items per (state, seller) so the window partition works on clean grain.*

