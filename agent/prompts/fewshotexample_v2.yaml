## Example 6: Average Review Score — Latest Review Per Order

**Question:** "What is the average review score, considering only the
latest review per order?"

```sql
SELECT AVG(review_score) AS avg_review_score
FROM (
    SELECT DISTINCT ON (order_id)
        order_id,
        review_score
    FROM order_reviews
    ORDER BY order_id, review_creation_date DESC
) AS latest_reviews;
```

*Note: DISTINCT ON (order_id) keeps one row per order_id — the one with
the most recent review_creation_date. Subquery aliased AS latest_reviews,
NOT a CTE. The validator does not recognize CTE names as valid tables.*

