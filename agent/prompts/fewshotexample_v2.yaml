## Example 12: Average Review Score — Latest Review Per Customer

**Question:** "What is the average review score considering only the
most recent review per customer?"

```sql
SELECT AVG(review_score) AS avg_review_score
FROM (
    SELECT DISTINCT ON (o.customer_id)
        o.customer_id,
        r.review_score
    FROM order_reviews r
    JOIN orders o ON r.order_id = o.order_id
    ORDER BY o.customer_id, r.review_creation_date DESC
) AS latest_reviews;
```

*Note: DISTINCT ON at customer grain instead of order grain. Must join
to orders to get the customer_id (order_reviews only has order_id).
Column o.customer_id is qualified with the `o` alias to disambiguate
from customers.customer_id (which is not joined here).*

