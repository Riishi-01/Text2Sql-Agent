## Example 3: Top 5 Sellers by Total Items Sold (NOT revenue)

**Question:** "Who are the top 5 sellers by total items sold?"

```sql
SELECT
    s.seller_id,
    COUNT(*) AS items_sold
FROM sellers s
JOIN order_items oi ON s.seller_id = oi.seller_id
GROUP BY s.seller_id
ORDER BY items_sold DESC
LIMIT 5;
```

*Note: Include ONLY the columns the question asks for — (seller_id,
items_sold). Do NOT add revenue, freight_value, or order_count unless
the question requests them. "Top 5 by X" returns exactly (id, X).*

---

## Example 4: Orders Canceled Before Payment Approval

**Question:** "How many orders were canceled before payment approval?"

```sql
SELECT COUNT(*) AS canceled_before_approval
FROM orders
WHERE order_status = 'canceled'
  AND order_approved_at IS NULL;
```

*Note: "How many / count of / number of" → ONE row with COUNT(*).
This is the ONLY aggregation that skips ORDER BY — top-N, distribution,
and per-X aggregations all need ORDER BY.*

---

## Example 5: Avg Items Per Order Per State (Top 5)

**Question:** "Show average basket size in items per customer state, top 5"

```sql
SELECT customer_state, ROUND(AVG(n_items), 2) AS avg_items
FROM (
    SELECT c.customer_state, COUNT(*) AS n_items
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    JOIN order_items oi ON o.order_id = oi.order_id
    WHERE o.order_status = 'delivered'
    GROUP BY o.order_id, c.customer_state
) AS sub
GROUP BY customer_state
ORDER BY avg_items DESC
LIMIT 5;
```

*Note: Pre-aggregate per order first, THEN average per state. Direct
AVG(COUNT(*)) is wrong grain. Subquery aliased AS sub, NOT a CTE.*

