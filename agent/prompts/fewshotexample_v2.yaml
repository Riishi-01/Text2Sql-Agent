## Example 11: Top 5 Sellers By Distinct Categories Sold (≥10 items)

**Question:** "Top 5 sellers by number of distinct product categories
they sell, only sellers with at least 10 items sold"

```sql
SELECT
    s.seller_id,
    COUNT(DISTINCT pct.product_category_name_english) AS n_categories
FROM sellers s
JOIN order_items oi ON s.seller_id = oi.seller_id
JOIN products p ON oi.product_id = p.product_id
LEFT JOIN product_category_translation pct
    ON p.product_category_name = pct.product_category_name
GROUP BY s.seller_id
HAVING COUNT(*) >= 10
ORDER BY n_categories DESC, s.seller_id
LIMIT 5;
```

*Note: Return ONLY (seller_id, n_categories) — do NOT add revenue or
item_count. Secondary ORDER BY s.seller_id is the deterministic
tiebreaker for the LIMIT 5 boundary. HAVING uses COUNT(*) on the raw
line items (not DISTINCT).*

