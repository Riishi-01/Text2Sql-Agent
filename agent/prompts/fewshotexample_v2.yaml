## Example 8: Compare Avg Review Score: 1-Item vs Multi-Item Orders

**Question:** "Compare average review score for single-item orders vs
multi-item orders"

```sql
SELECT
    CASE WHEN sub.n_items = 1 THEN 'single_item' ELSE 'multi_item' END AS basket_type,
    ROUND(AVG(r.review_score), 3) AS avg_score,
    COUNT(*) AS n
FROM order_reviews r
JOIN (
    SELECT o.order_id, COUNT(*) AS n_items
    FROM order_items oi
    JOIN orders o ON oi.order_id = o.order_id
    GROUP BY o.order_id
) AS sub ON r.order_id = sub.order_id
GROUP BY basket_type;
```

*Note: CASE WHEN directly in SELECT + GROUP BY on the alias. Subquery
pre-aggregates the per-order item count so the CASE compares per-order
grain, not per-line-item.*

