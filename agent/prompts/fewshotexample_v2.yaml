## Example 15: Top 5 Categories By Item Count — Anti-Over-Generation

**Question:** "Top 5 product categories by total items sold"

```sql
SELECT
    COALESCE(pct.product_category_name_english, p.product_category_name) AS category,
    COUNT(*) AS item_count
FROM order_items oi
JOIN products p ON oi.product_id = p.product_id
LEFT JOIN product_category_translation pct
    ON p.product_category_name = pct.product_category_name
GROUP BY COALESCE(pct.product_category_name_english, p.product_category_name)
ORDER BY item_count DESC
LIMIT 5;
```

*Note: ANTI-OVER-GENERATION CANONICAL SHAPE. The question asks for
"top 5 by item count" — return EXACTLY (category, item_count). Do NOT
add SUM(price + freight_value) as `revenue`, COUNT(DISTINCT order_id) as
`n_orders`, or any other "useful-looking" metric unless the question
explicitly asks. This is the canonical shape for the
e01 / h04 / h05 / m01 failure family.*
