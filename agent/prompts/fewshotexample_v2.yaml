# Few-Shot Examples — v2 
# The prompt builder compiles this file when few_shot_version == "v2".


## Example 1: Total Revenue by Customer State

**Question:** "What is the total revenue by customer state?"

```sql
SELECT
    c.customer_state,
    ROUND(SUM(oi.price + oi.freight_value), 2) AS revenue
FROM orders o
JOIN customers c ON o.customer_id = c.customer_id
JOIN order_items oi ON o.order_id = oi.order_id
GROUP BY c.customer_state
ORDER BY revenue DESC
LIMIT 27;
```

*Note: Revenue = price + freight_value. No order_status filter — the
question asks for all orders, not just delivered ones. Only add the
order_status filter when the question explicitly mentions "delivered",
"shipped", "canceled", etc.*

