## Example 13: Top 3 SP Sellers In bed_bath_table 2017 (4-hop join)

**Question:** "Top 3 sellers in SP by items sold for the bed_bath_table
category in 2017"

```sql
SELECT
    s.seller_id,
    COUNT(*) AS items_sold
FROM orders o
JOIN order_items oi ON o.order_id = oi.order_id
JOIN sellers s ON oi.seller_id = s.seller_id
JOIN products p ON oi.product_id = p.product_id
JOIN customers c ON o.customer_id = c.customer_id
LEFT JOIN product_category_translation pct
    ON p.product_category_name = pct.product_category_name
WHERE c.customer_state = 'SP'
  AND pct.product_category_name_english = 'bed_bath_table'
  AND o.order_purchase_timestamp >= '2017-01-01'
  AND o.order_purchase_timestamp < '2018-01-01'
GROUP BY s.seller_id
ORDER BY items_sold DESC
LIMIT 3;
```

*Note: 4-hop chain (orders → order_items → sellers + orders →
order_items → products → product_category_translation). All filters
(state, English category name, date range) live next to the joins that
introduce their tables. Date range uses half-open interval
[2017-01-01, 2018-01-01).*

