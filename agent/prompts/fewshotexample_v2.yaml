## Example 9: Order Count Distribution Per Seller

**Question:** "How many sellers sold exactly N distinct orders?"

```sql
SELECT n_orders, COUNT(*) AS n_sellers
FROM (
    SELECT seller_id, COUNT(DISTINCT order_id) AS n_orders
    FROM order_items
    GROUP BY seller_id
) AS sub
GROUP BY n_orders
ORDER BY n_orders;
```

*Note: Distribution = return ALL rows, no LIMIT. "Distribution of X"
= one row per distinct X value.*

