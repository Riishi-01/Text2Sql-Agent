## Example 2: Average Order Value by Product Category

**Question:** "Show average order value by product category"

```sql
SELECT
    COALESCE(pct.product_category_name_english, p.product_category_name) AS category,
    ROUND(AVG(oi.price + oi.freight_value), 2) AS avg_order_value
FROM order_items oi
JOIN products p ON oi.product_id = p.product_id
LEFT JOIN product_category_translation pct
    ON p.product_category_name = pct.product_category_name
GROUP BY COALESCE(pct.product_category_name_english, p.product_category_name)
ORDER BY avg_order_value DESC
LIMIT 20;
```

*Note: Always COALESCE to the English name. LEFT JOIN so untranslated
products still appear.*

