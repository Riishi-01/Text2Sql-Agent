## Example 10: Total Payment Value By Payment Type

**Question:** "Show total payment value for each payment method, highest first"

```sql
SELECT
    payment_type,
    ROUND(SUM(payment_value), 2) AS total_value,
    COUNT(*) AS n
FROM order_payments
GROUP BY payment_type
ORDER BY total_value DESC;
```

*Note: SUM (not AVG) — question asks for total. Always include ORDER BY
when the question implies order ("highest first", "top", "bottom",
"ordered by").*

