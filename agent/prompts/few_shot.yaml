## Example 15: Top-N Subset, Then Aggregate
**Question**: "Average review score for the top 5 product categories by review count"

```sql
SELECT category, ROUND(avg_score, 2) AS avg_score, n_reviews
FROM (
  SELECT COALESCE(t.product_category_name_english, p.product_category_name) AS category,
         AVG(r.review_score) AS avg_score,
         COUNT(*) AS n_reviews
  FROM order_reviews r
  JOIN order_items oi ON r.order_id = oi.order_id
  JOIN products p ON oi.product_id = p.product_id
  LEFT JOIN product_category_translation t
    ON p.product_category_name = t.product_category_name
  GROUP BY COALESCE(t.product_category_name_english, p.product_category_name)
) AS sub
WHERE n_reviews >= 100
ORDER BY n_reviews DESC
LIMIT 5;
```

*Note: "Top N by X, then Y by Z" — first restrict to the top N (using
LIMIT inside an aggregation subquery), then compute Y for just those N.
Don't compute Y for all rows and then filter — that's the wrong denominator.
The subquery computes counts/averages for all categories; the outer query
selects the top 5 by count.*

