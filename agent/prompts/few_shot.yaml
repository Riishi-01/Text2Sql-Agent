## Example 4: Distinct Customer Count
**Question**: "How many unique customers placed orders in 2017?"

```sql
SELECT COUNT(DISTINCT c.customer_unique_id) AS unique_customers
FROM orders o
JOIN customers c ON o.customer_id = c.customer_id
WHERE o.order_purchase_timestamp >= '2017-01-01'
  AND o.order_purchase_timestamp < '2018-01-01';
```

*Note: customer_unique_id (not customer_id) for unique people across orders.*

