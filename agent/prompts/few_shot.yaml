## Example 9: Monthly Trend — TO_CHAR Bucketing
**Question**: "Monthly order count (full trend across the dataset)"

```sql
SELECT TO_CHAR(order_purchase_timestamp, 'YYYY-MM') AS ym,
       COUNT(*) AS order_count
FROM orders
GROUP BY ym
ORDER BY ym;
```

*Note: TO_CHAR('YYYY-MM') gives one sortable column for month buckets.
Do NOT split into EXTRACT(YEAR) + EXTRACT(MONTH) — that gives two columns, wrong shape.
No LIMIT — "full trend" means all months.*

