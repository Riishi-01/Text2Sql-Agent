## Example 13: Simple Aggregation with ORDER BY
**Question**: "Average payment value per payment type, highest first"

```sql
SELECT payment_type,
       ROUND(AVG(payment_value), 2) AS avg_value,
       COUNT(*) AS n
FROM order_payments
GROUP BY payment_type
ORDER BY avg_value DESC;
```

*Note: Always include ORDER BY when ranking or when the question implies
order ("highest first", "top", "bottom", "ordered by"). Even simple
GROUP BY aggregations need explicit sorting unless the question
explicitly doesn't care about order.*

