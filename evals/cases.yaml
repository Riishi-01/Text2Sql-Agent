cases:
- id: e01_5_selling_products_health_beauty
  source_query_id: 1
  difficulty: easy
  discourse: ranking+filter
  tables:
  - order_items
  - product_category_translation
  - products
  trap: null
  tags:
  - ranking
  - filter
  question: top 5 selling products in health beauty, category
  gold_sql: |
    SELECT i.product_id, COUNT(*) AS n_sold
    FROM order_items i
    JOIN products p ON i.product_id = p.product_id
    LEFT JOIN product_category_translation t ON p.product_category_name = t.product_category_name
    WHERE t.product_category_name_english = 'health_beauty'
    GROUP BY i.product_id
    ORDER BY n_sold DESC, i.product_id
    LIMIT 5
  expected:
    shape:
      rows: 5
      cols: 2
    expected_rows:
    - - 154e7e31ebfa092203795c972e5804a6
      - 281
    - - 2b4609f8948be18874494203496bc318
      - 260
    - - 7c1bd920dbdf22470b68bde975dd3ccf
      - 231
    - - bb50f2e236e5eea0100680137654686c
      - 195
    - - 19c91ef95d509ea33eda93495c4d3481
      - 156
    columns:
    - product_id
    - n_sold
  acceptable_variants:
  - (see gold_sql)
  business_meaning: top 5 selling products in health beauty, category
  rubric:
    table:
      required: true
      spec: order_items.product_id, products.product_id, product_category_translation.product_category_name_english
      items:
      - order_items.product_id
      - products.product_id
      - product_category_translation.product_category_name_english
    time_frame:
      required: false
    filters:
      required: true
      spec: product_category_translation.product_category_name_english = 'health_beauty'
      items:
      - product_category_translation.product_category_name_english = 'health_beauty'
    aggregation:
      required: true
      spec: COUNT, GROUP BY product_id, ORDER BY COUNT DESC, LIMIT 5
      items:
      - COUNT
      - GROUP BY product_id
      - ORDER BY COUNT DESC
      - LIMIT 5
    join:
      required: true
      spec: order_items JOIN products (order_items.product_id = products.product_id); LEFT JOIN product_category_translation (products.product_category_name = product_category_translation.product_category_name)
      items:
      - order_items JOIN products (order_items.product_id = products.product_id)
      - LEFT JOIN product_category_translation (products.product_category_name = product_category_translation.product_category_name)
    date_operator:
      required: false
