- id: e06_orders_delivered_late
  source_query_id: 6
  difficulty: easy
  discourse: filter+count
  tables:
  - orders
  trap: null
  tags:
  - filter
  - count
  question: Orders delivered late
  gold_sql: |
    SELECT COUNT(*)
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
      AND order_estimated_delivery_date IS NOT NULL
      AND order_delivered_customer_date > order_estimated_delivery_date
  expected:
    shape:
      rows: 1
      cols: 1
    expected_rows:
    - - 7826
    columns:
    - count
    scalar: 7826
  acceptable_variants:
  - (see gold_sql)
  business_meaning: Orders delivered late
  rubric:
    table:
      required: true
      spec: orders.order_status, orders.order_delivered_customer_date, orders.order_estimated_delivery_date
      items:
      - orders.order_status
      - orders.order_delivered_customer_date
      - orders.order_estimated_delivery_date
    time_frame:
      required: true
      spec: 'date comparison operator: > (delivered > estimated → late)'
      items:
      - 'date comparison operator: > (delivered > estimated → late)'
    filters:
      required: true
      spec: order_status = 'delivered'; order_delivered_customer_date IS NOT NULL; order_estimated_delivery_date IS NOT NULL; order_delivered_customer_date > order_estimated_delivery_date
      items:
      - order_status = 'delivered'
      - order_delivered_customer_date IS NOT NULL
      - order_estimated_delivery_date IS NOT NULL
      - order_delivered_customer_date > order_estimated_delivery_date
    aggregation:
      required: true
      spec: COUNT
      items:
      - COUNT
    join:
      required: false
    date_operator:
      required: false
