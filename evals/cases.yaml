- id: h04_5_categories_worst_late_delivery
  source_query_id: 23
  difficulty: hard
  discourse: D9_operational_kpi
  tables:
  - order_items
  - orders
  - product_category_translation
  - products
  trap: null
  tags:
  - D9_operational_kpi
  question: Top 5 product categories with the worst late-delivery rate, where the rate is the percentage of delivered orders (with non-null delivery date and estimated delivery date) that were delivered after the estimated date, computed as (count of late orders) divided by (count of delivered orders) per category, and only categories with at least 50 delivered orders are eligible
  gold_sql: |
    SELECT COALESCE(t.product_category_name_english, p.product_category_name) AS category,
           ROUND(SUM(CASE WHEN o.order_delivered_customer_date > o.order_estimated_delivery_date THEN 1 ELSE 0 END) * 100.0 / COUNT(DISTINCT o.order_id), 2) AS late_delivery_rate_pct,
           COUNT(DISTINCT o.order_id) AS n_delivered_orders
    FROM orders o
    JOIN order_items oi ON o.order_id = oi.order_id
    JOIN products p ON oi.product_id = p.product_id
    LEFT JOIN product_category_translation t ON p.product_category_name = t.product_category_name
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND o.order_estimated_delivery_date IS NOT NULL
    GROUP BY COALESCE(t.product_category_name_english, p.product_category_name)
    HAVING COUNT(DISTINCT o.order_id) >= 50
    ORDER BY late_delivery_rate_pct DESC, n_delivered_orders DESC
    LIMIT 5
