- id: h01_average_total_spend_unique_customer
  source_query_id: 20
  difficulty: hard
  discourse: D7_filter_aggregate
  tables:
  - customers
  - order_items
  - orders
  trap: null
  tags:
  - D7_filter_aggregate
  question: Average total spend per unique customer (LTV proxy)
  gold_sql: |
    SELECT ROUND(AVG(customer_total), 2) AS avg_ltv
    FROM (
      SELECT c.customer_unique_id, SUM(i.price + i.freight_value) AS customer_total
      FROM customers c
      JOIN orders o ON c.customer_id = o.customer_id
      JOIN order_items i ON o.order_id = i.order_id
      GROUP BY c.customer_unique_id
    ) AS sub
  expected:
    shape:
      rows: 1
      cols: 1
    expected_rows:
    - - 166.04
    columns:
    - avg_ltv
    scalar: 166.04
  acceptable_variants:
  - (see gold_sql)
  business_meaning: Average total spend per unique customer (LTV proxy)
  rubric:
    table:
      required: true
      spec: customers.customer_unique_id, order_items.price, order_items.freight_value
      items:
      - customers.customer_unique_id
      - order_items.price
      - order_items.freight_value
    time_frame:
      required: false
    filters:
      required: false
    aggregation:
      required: true
      spec: AVG,SUM
      items:
      - AVG
      - SUM
    join:
      required: true
      spec: INNER JOIN orders ON customers.customer_id = orders.customer_id; INNER JOIN order_items ON orders.order_id = order_items.order_id
      items:
      - INNER JOIN orders ON customers.customer_id = orders.customer_id
      - INNER JOIN order_items ON orders.order_id = order_items.order_id
    date_operator:
      required: false
- id: h02_overall_repeat_customer_rate_customers
  source_query_id: 21
  difficulty: hard
  discourse: D8_cohort
  tables:
  - customers
  trap: null
  tags:
  - D8_cohort
  question: Overall repeat customer rate (% of customers with > 1 order)
  gold_sql: |
    SELECT ROUND(100.0 * SUM(CASE WHEN n_orders > 1 THEN 1 ELSE 0 END) / COUNT(*), 2) AS repeat_pct
    FROM (
      SELECT customer_unique_id, COUNT(DISTINCT customer_id) AS n_orders
      FROM customers GROUP BY customer_unique_id
    ) AS sub
  expected:
    shape:
      rows: 1
      cols: 1
    expected_rows:
    - - 3.12
    columns:
    - repeat_pct
    scalar: 3.12
  acceptable_variants:
  - (see gold_sql)
  business_meaning: Overall repeat customer rate (% of customers with > 1 order)
  rubric:
    table:
      required: true
      spec: customers.customer_unique_id, customers.customer_id
      items:
      - customers.customer_unique_id
      - customers.customer_id
    time_frame:
      required: false
    filters:
      required: false
    aggregation:
      required: true
      spec: COUNT; DISTINCT required
      items:
      - COUNT
      - DISTINCT required
    join:
      required: false
    date_operator:
      required: false
- id: h03_5_sellers_by_number_distinct
  source_query_id: 22
  difficulty: hard
  discourse: D7_filter_aggregate
  tables:
  - customers
  - order_items
  - orders
  - sellers
  trap: null
  tags:
  - D7_filter_aggregate
  question: Top 5 sellers by number of distinct customer states served
  gold_sql: |
    SELECT T1.seller_id, COUNT(DISTINCT T3.customer_state) AS n_states
    FROM sellers T1
    JOIN order_items T2 ON T1.seller_id = T2.seller_id
    JOIN orders T4 ON T2.order_id = T4.order_id
    JOIN customers T3 ON T4.customer_id = T3.customer_id
    GROUP BY T1.seller_id
    ORDER BY n_states DESC, T1.seller_id
    LIMIT 5
  expected:
    shape:
      rows: 5
      cols: 2
    expected_rows:
    - - 1025f0e2d44d7041d6cf58b6550e0bfa
      - 27
    - - 2138ccb85b11a4ec1e37afbd1c8eda1f
      - 27
