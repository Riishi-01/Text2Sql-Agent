- id: e03_most_used_payment_methods_computers
  source_query_id: 3
  difficulty: easy
  discourse: filter+aggregate
  tables:
  - order_items
  - order_payments
  - orders
  - product_category_translation
  - products
  trap: null
  tags:
  - filter
  - aggregate
  question: What is the most used payment methods for computers accessories
  gold_sql: |
    SELECT op.payment_type, COUNT(*) AS n
    FROM order_payments op
    JOIN orders o ON op.order_id = o.order_id
    JOIN order_items i ON o.order_id = i.order_id
    JOIN products p ON i.product_id = p.product_id
    LEFT JOIN product_category_translation t ON p.product_category_name = t.product_category_name
    WHERE t.product_category_name_english = 'computers_accessories'
    GROUP BY op.payment_type
    ORDER BY n DESC
  expected:
    shape:
      rows: 4
      cols: 2
    expected_rows:
    - - credit_card
      - 5436
    - - boleto
      - 2158
    - - voucher
      - 340
    - - debit_card
      - 148
    columns:
    - payment_type
    - n
  acceptable_variants:
  - (see gold_sql)
  business_meaning: What is the most used payment methods for computers accessories
  rubric:
    table:
      required: true
      spec: order_payments.payment_type, products.product_category_name, product_category_translation.product_category_name_english
      items:
      - order_payments.payment_type
      - products.product_category_name
      - product_category_translation.product_category_name_english
    time_frame:
      required: false
    filters:
      required: true
      spec: product_category_translation.product_category_name_english = 'computers_accessories'
      items:
      - product_category_translation.product_category_name_english = 'computers_accessories'
    aggregation:
      required: true
      spec: COUNT, GROUP BY payment_type, ORDER BY count DESC
      items:
      - COUNT
      - GROUP BY payment_type
      - ORDER BY count DESC
    join:
      required: true
      spec: order_payments JOIN orders; orders JOIN order_items; order_items JOIN products; products LEFT JOIN product_category_translation
      items:
      - order_payments JOIN orders
      - orders JOIN order_items
      - order_items JOIN products
      - products LEFT JOIN product_category_translation
    date_operator:
      required: false
