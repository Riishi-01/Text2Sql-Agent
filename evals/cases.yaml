- id: h05_payment_method_share_5_revenue
  source_query_id: 24
  difficulty: hard
  discourse: D5_distribution
  tables:
  - order_items
  - order_payments
  - orders
  - product_category_translation
  - products
  trap: null
  tags:
  - D5_distribution
  question: For each of the top-5 revenue product categories, show each payment method's share of the category's total payment value, where revenue is computed from order items as sum of price plus freight_value and share is expressed as a percentage of the category's total payment value (not as a count of payments)
  gold_sql: |
    SELECT sub.category, sub.payment_type,
           ROUND(sub.payment_value, 2) AS payment_value,
           ROUND(sub.payment_value * 100.0 / SUM(sub.payment_value) OVER (PARTITION BY sub.category), 2) AS payment_share_pct
    FROM (
      SELECT COALESCE(pct.product_category_name_english, p.product_category_name) AS category,
             op.payment_type,
             SUM(op.payment_value) AS payment_value
      FROM orders o
      JOIN order_payments op ON o.order_id = op.order_id
      JOIN order_items oi ON o.order_id = oi.order_id
      JOIN products p ON oi.product_id = p.product_id
      LEFT JOIN product_category_translation pct ON p.product_category_name = pct.product_category_name
      WHERE COALESCE(pct.product_category_name_english, p.product_category_name) IN (
        SELECT top_cat.category FROM (
          SELECT COALESCE(pct2.product_category_name_english, p2.product_category_name) AS category,
                 SUM(oi2.price + oi2.freight_value) AS revenue
          FROM order_items oi2
          JOIN products p2 ON oi2.product_id = p2.product_id
          LEFT JOIN product_category_translation pct2 ON p2.product_category_name = pct2.product_category_name
          GROUP BY COALESCE(pct2.product_category_name_english, p2.product_category_name)
          ORDER BY revenue DESC LIMIT 5
        ) AS top_cat
      )
      GROUP BY COALESCE(pct.product_category_name_english, p.product_category_name), op.payment_type
    ) AS sub
    ORDER BY sub.category, payment_share_pct DESC
